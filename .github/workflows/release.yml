# Builds, signs and publishes a release whenever a tag like v1.0.0 is pushed: signed package, GitHub
# release, App Store. Creating a release with a new tag on the GitHub website works too.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   APP_PRIVATE_KEY   content of abscompat.key
#   APPSTORE_TOKEN    API token from https://apps.nextcloud.com/account/token; without it the App
#                     Store step is skipped
# The certificate is public: scripts/abscompat.crt.
#
# The tag must match <version> in appinfo/info.xml, be on main, and have a dated CHANGELOG entry.
name: Release

on:
  push:
    tags: ['v*']
  # Submits a release that is on GitHub but not in the App Store, without building it again.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the existing release, like v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build (no secrets)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          git fetch -q origin main:refs/remotes/origin/main
          scripts/release-check.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: abscompat/build-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned
          path: abscompat/build/abscompat-${{ steps.check.outputs.version }}.tar.gz
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned
          path: unsigned
      - name: Sign
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          [ -n "$APP_PRIVATE_KEY" ] || { echo "::error::The secret APP_PRIVATE_KEY is missing (docs/RELEASING.md)"; exit 1; }
          umask 077
          trap 'rm -f "$RUNNER_TEMP/abscompat.key"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$RUNNER_TEMP/abscompat.key"
          scripts/sign-release.sh "unsigned/abscompat-$VERSION.tar.gz" "$RUNNER_TEMP/abscompat.key" signed
      - name: GitHub release
        run: |
          # A release made on the website exists already. Files are never replaced: the upload
          # fails when they are there, because the App Store may know their signature.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "signed/abscompat-$VERSION.tar.gz" signed/signature.txt
          else
            awk -v v="## $VERSION " 'index($0, v) == 1 {f=1; next} /^## /{f=0} f' abscompat/CHANGELOG.md | sed '/./,$!d' > notes.md
            gh release create "v$VERSION" "signed/abscompat-$VERSION.tar.gz" signed/signature.txt \
              --verify-tag --title "Audiobookshelf Minus $VERSION" --notes-file notes.md
          fi
      - name: App Store
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: python3 -I scripts/appstore-submit.py "v$VERSION"

  submit:
    name: Submit an existing release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: App Store
        env:
          TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: python3 -I scripts/appstore-submit.py "$TAG"
